name = "tensorCore"
version = "0.1.0"
defaultTargets = ["TensorCore", "tc_trace", "tc_features", "tc_eft_paper", "tc_bounded_eft", "tc_gemm", "tc_ieee"]

[leanOptions]
pp.unicode.fun = true

[[lean_lib]]
name = "TensorCore"
globs = ["TensorCore", "TensorCore.*"]

[[lean_exe]]
name = "tc_trace"
root = "Main.Trace"

[[lean_exe]]
name = "tc_features"
root = "Main.Features"

[[lean_exe]]
name = "tc_eft_paper"
root = "Main.EFT"

[[lean_exe]]
name = "tc_bounded_eft"
root = "Main.BoundedEFT"

[[lean_exe]]
name = "tc_gemm"
root = "Main.Gemm"

[[lean_exe]]
name = "tc_ieee"
root = "Main.IEEE"

[[lean_exe]]
name = "tc_lean_ieee_check"
root = "Main.LeanIEEECheck"

[[lean_exe]]
name = "tc_lean_eft_check"
root = "Main.LeanEFTCheck"
